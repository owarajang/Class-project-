<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
           <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->
  <div class="card">
      <img class="card-img-top" src="images/Screenshot 2026-09-30 at 5.57.32 PM.png" alt="Card image" style="width:300px">
  <div class="card-body">
    <h4 class="card-title">Projects</h4>
    <p class="card-text">This is a website that I made in my CS 1030 class.</p>
    <a href="https://owarajang.github.io/web-version-control-starter-project/index.html" class="card-link">Website</a>
  </div>
</div>

          <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
    </head>
</html>
