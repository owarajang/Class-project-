<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
           <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->

    <div classs="row">
      <div class="col"></div>
<div class="container p-5 my-5 bg-dark text-white">
      <h1>WELCOME</h1>
      <div class="card">
        <div class="card-body bg-dark text-white">
          <h2 class="card-title">
          <h2>Owar Ajang</h2>
          <p>I'm Owar Ajang and this is my portfolio website. 
            A brief overview of what I have on the page is my resume
             and about along with any experience I have. 
             I'm really excieted to make this and I hope you enjoy
          </p>
        </div>
      </div>
      </div>
         <img src="images/IMG_3122.jpeg" class="img-thumbnail" alt="My image" width="300px">
        </div>
        </div>
        </div>
      
          <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
    </head>
</html>
