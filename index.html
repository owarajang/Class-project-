<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
           <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->

    <div class ="row">
      <div class ="col">
      <div class="container-fluid.mt-3 bg-dark text-white">
      <h1>Owar Ajang</h1>
      <div class="card">
        <div class="card-body bg-dark text-white">
          <h5 class="card-title">
          <p>
            Hello,My name is Owar Ajang and this is my portfolio webstie.
            This website will show all the experiences that I have, the projects ive worked on,
             the languages I've learned along with goals and aspirations I have for the tech industry!!
          </p>
        </div>
        <div class ="card">
         <img src="images/IMG_3122.jpeg" class="img-fluid" alt="My image" width="200px">
        </div>
      </div>
      </div>
      </div>

          <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
    </head>
</html>
